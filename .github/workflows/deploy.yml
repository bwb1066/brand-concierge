name: Deploy to GitHub Pages

# Publishes ONLY the widget/ directory (the gizmo frontend) to GitHub Pages at
# https://bwb1066.github.io/brand-concierge/widget/. Edge-function source is not
# served. Runs only when the widget (or this workflow) changes.

on:
  push:
    branches: [main]
    paths:
      - 'widget/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage widget for Pages
        run: |
          mkdir -p _site/widget
          cp -r widget/. _site/widget/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
